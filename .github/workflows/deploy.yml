name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      pages_build_type: ${{ steps.pages_mode.outputs.build_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect GitHub Pages build type
        id: pages_mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          build_type="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type // "legacy"' 2>/dev/null || echo "legacy")"
          echo "Detected Pages build type: ${build_type}"
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Firebase env vars
        run: |
          set -e
          required_vars=(
            NEXT_PUBLIC_FIREBASE_API_KEY
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
            NEXT_PUBLIC_FIREBASE_PROJECT_ID
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
            NEXT_PUBLIC_FIREBASE_APP_ID
          )

          for var_name in "${required_vars[@]}"; do
            value="${!var_name:-}"
            if [ -z "$value" ]; then
              echo "Missing required GitHub repository variable: $var_name"
              echo "Set it under Settings -> Secrets and variables -> Actions -> Variables."
              exit 1
            fi
          done
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyC_yva6X8wvJH5aFCC07YXvJtflbQEO0AU' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'bibleguessr-c9257.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'bibleguessr-c9257' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'bibleguessr-c9257.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '414225257381' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:414225257381:web:170f63bff206c9eebb4e4c' }}

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: true
          NEXT_DEPLOYMENT_ID: ${{ github.sha }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyC_yva6X8wvJH5aFCC07YXvJtflbQEO0AU' }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'bibleguessr-c9257.firebaseapp.com' }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'bibleguessr-c9257' }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'bibleguessr-c9257.firebasestorage.app' }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '414225257381' }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:414225257381:web:170f63bff206c9eebb4e4c' }}

      - name: Mirror export to /BibleGuessr path
        run: |
          set -e
          mkdir -p out/BibleGuessr
          rsync -a --delete --exclude 'BibleGuessr' out/ out/BibleGuessr/

      - name: Upload Pages artifact
        if: steps.pages_mode.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Sync static export into repository for legacy Pages mode
        if: steps.pages_mode.outputs.build_type != 'workflow'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          rm -rf BibleGuessr
          mkdir -p BibleGuessr
          rsync -a --delete out/BibleGuessr/ BibleGuessr/

          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <meta http-equiv="refresh" content="0; url=/BibleGuessr/" />
              <title>BibleGuessr</title>
              <script>
                window.location.replace('/BibleGuessr/');
              </script>
            </head>
            <body>
              <p>Redirecting to <a href="/BibleGuessr/">BibleGuessr</a>...</p>
            </body>
          </html>
          HTML

          printf '' > .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BibleGuessr index.html .nojekyll

          if git diff --cached --quiet; then
            echo "No legacy Pages changes to commit."
            exit 0
          fi

          git commit -m "chore(pages): sync static export for legacy source [skip ci]"
          git push origin HEAD:main

  deploy:
    if: needs.build.outputs.pages_build_type == 'workflow'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4