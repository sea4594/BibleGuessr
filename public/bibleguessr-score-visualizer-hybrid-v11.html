<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BibleGuessr Score Visualizer</title>
<style>
  :root {
    --bg:#f7f8fb; --panel:#ffffff; --border:#d9dee8; --text:#172033; --muted:#687386;
    --blue:#3375c4; --blueFill:#8fb9e7; --red:#d62929;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:var(--bg); }
  body { padding:8px; }
  .app { width:100%; max-width:2200px; margin:0 auto; }
  .topbar { min-height:42px; display:flex; gap:10px; align-items:center; margin-bottom:7px; }
  .answer-block { flex:1; min-width:0; display:flex; align-items:center; gap:8px; }
  label.head { flex:0 0 auto; font-size:11px; font-weight:750; color:var(--muted); text-transform:uppercase; letter-spacing:.055em; }
  #answerBox { width:min(360px,42vw); min-width:190px; border:1px solid var(--border); border-radius:7px; padding:6px 9px; font-size:17px; line-height:1.15; font-weight:750; background:#fff; color:var(--text); }
  .meta { min-width:0; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .drawer-toggle { flex:0 0 auto; border:1px solid var(--border); background:#fff; color:var(--text); border-radius:8px; padding:7px 10px; font-weight:700; cursor:pointer; box-shadow:0 1px 2px rgba(20,30,50,.04); }
  .drawer-toggle:hover { background:#f2f5f9; }
  .left { min-width:0; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:9px; margin-bottom:7px; overflow:hidden; box-shadow:0 1px 2px rgba(20,30,50,.035); }
  .panel:last-child { margin-bottom:0; }
  .panel-head { min-height:34px; padding:5px 9px; border-bottom:1px solid #edf0f4; display:flex; align-items:center; gap:10px; white-space:nowrap; overflow:hidden; }
  .panel-head h2 { flex:0 0 auto; margin:0; font-size:13px; line-height:1.2; }
  .graph-scroll { overflow-x:auto; overflow-y:hidden; position:relative; background:#fff; scrollbar-width:thin; }
  svg { display:block; user-select:none; -webkit-user-select:none; touch-action:none; cursor:crosshair; }
  #tooltip { position:fixed; display:none; z-index:100; pointer-events:none; background:rgba(20,27,39,.95); color:#fff; font-size:11px; line-height:1.3; padding:6px 8px; border-radius:6px; box-shadow:0 4px 18px rgba(0,0,0,.18); white-space:nowrap; }
  .drawer-backdrop { position:fixed; inset:0; z-index:70; background:rgba(17,24,39,.16); opacity:0; pointer-events:none; transition:opacity .16s ease; }
  .drawer-backdrop.open { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; z-index:80; top:0; right:0; width:285px; max-width:88vw; height:100vh; background:#fff; border-left:1px solid var(--border); box-shadow:-8px 0 28px rgba(24,34,52,.16); transform:translateX(102%); transition:transform .18s ease; display:flex; flex-direction:column; }
  .drawer.open { transform:translateX(0); }
  .drawer-head { flex:0 0 auto; height:43px; display:flex; align-items:center; justify-content:space-between; padding:7px 10px 7px 12px; border-bottom:1px solid #edf0f4; }
  .drawer-head strong { font-size:14px; }
  .drawer-close { width:29px; height:29px; border:0; border-radius:7px; background:transparent; font-size:22px; line-height:1; cursor:pointer; color:#566174; }
  .drawer-close:hover { background:#f2f5f9; }
  .drawer-body { flex:1; overflow:auto; padding:9px 11px 14px; }
  .testament { border-top:1px solid #edf0f4; padding-top:7px; margin-top:7px; }
  .testament:first-of-type { border-top:0; padding-top:0; margin-top:0; }
  .parent-check { display:flex; align-items:center; gap:6px; font-weight:750; font-size:13px; margin-bottom:4px; }
  .book-check { display:flex; align-items:center; gap:6px; font-size:12px; line-height:1.2; padding:1.5px 0 1.5px 18px; }
  input[type=checkbox] { width:14px; height:14px; margin:0; accent-color:#2f70bd; }
  @media (max-width:760px) {
    body { padding:5px; }
    .topbar { align-items:stretch; gap:5px; }
    .answer-block { flex-wrap:wrap; gap:4px 6px; }
    #answerBox { width:min(310px,70vw); font-size:15px; }
    .meta { width:100%; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="answer-block">
      <label class="head" for="answerBox">Correct answer</label>
      <input id="answerBox" type="text" readonly value="1 Corinthians 3:11" />
      <div class="meta"><span id="poolText">66 books selected</span> · Scores before context-verse penalties</div>
    </div>
    <button id="drawerToggle" class="drawer-toggle" type="button" aria-controls="bookDrawer" aria-expanded="false">Books (<span id="drawerCount">66</span>)</button>
  </div>

  <main class="left">
    <section class="panel">
      <div class="panel-head">
        <h2>Score range by chapter</h2>
      </div>
      <div id="graph1Scroll" class="graph-scroll"><svg id="graph1"></svg></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 id="graph2Title">Verse scores — 1 Corinthians</h2>
      </div>
      <div id="graph2Scroll" class="graph-scroll"><svg id="graph2"></svg></div>
    </section>
  </main>
</div>
<div id="drawerBackdrop" class="drawer-backdrop"></div>
<aside id="bookDrawer" class="drawer" aria-hidden="true">
  <div class="drawer-head"><strong>Books</strong><button id="drawerClose" class="drawer-close" type="button" aria-label="Close books">×</button></div>
  <div class="drawer-body">
    <div id="bookChecklist"></div>
  </div>
</aside>
<div id="tooltip"></div>

// Hybrid scoring system, v11.
//
// Wrong-book scoring is unchanged from the original BibleGuessr logic.
// Correct-book scoring is intentionally simple:
//   1) exact reference = 100;
//   2) non-exact references top out at 99.4;
//   3) the correct-book floor depends ONLY on the number of active books;
//   4) within the correct book, score is a fixed blend of:
//        - 70% numerical-chapter proximity
//        - 30% absolute-verse proximity
//   5) both proximity curves are normalized against the FULL book span, so
//      moving the correct answer only slides the same curve left/right;
//   6) chapter proximity is almost linear (x^0.90), preserving meaningful
//      differences even far away in long books;
//   7) the verse curve is deliberately wider than v10 so nearby guesses in
//      long books do not lose points too quickly.
function calculateScoreTotal(correct, guess, activeBooks) {
  const normalizedActiveBooks = activeBooks.length > 0 ? activeBooks : [];
  const N = normalizedActiveBooks.length;
  const activeTestaments = new Set(normalizedActiveBooks.map(book => getBookTestament(book.book)));
  const activeCategories = new Set(normalizedActiveBooks.map(book => getBookCategory(book.book)));
  const testamentGuaranteed = activeTestaments.size <= 1;
  const categoryGuaranteed = activeCategories.size <= 1;

  // Original book-value calculation is retained only for wrong-book
  // Testament/category partial credit.
  const B = N <= 1 ? 0 : 20 + (20 * Math.log(N)) / Math.log(66);
  const g = B / 40;

  if (guess.book !== correct.book) {
    let testamentPoints = 0;
    let categoryPoints = 0;
    if (!testamentGuaranteed && getBookTestament(guess.book) === getBookTestament(correct.book)) testamentPoints = 15 * g;
    if (!categoryGuaranteed && getBookCategory(guess.book) === getBookCategory(correct.book)) categoryPoints = 15 * g;
    return clampScore(testamentPoints + categoryPoints);
  }

  const correctBookData = normalizedActiveBooks.find(book => book.book === correct.book);
  if (!correctBookData) return 0;

  const correctOrdinal = getBookVerseOrdinal(correctBookData, correct.chapter, correct.verse);
  const guessOrdinal = getBookVerseOrdinal(correctBookData, guess.chapter, guess.verse);
  const verseDistance = Math.abs(correctOrdinal - guessOrdinal);
  const chapterDistance = Math.abs(correct.chapter - guess.chapter);

  if (verseDistance === 0) return 100;

  const nonExactCeiling = 99.4;

  // Correct-book floor depends ONLY on the number of books in the active pool.
  // Approximate anchors:
  //   2 books  -> 30.4
  //   10 books -> 40.0
  //   66 books -> 50.0
  // A one-book mode has no guaranteed book credit because the book is already known.
  const correctBookFloor = (() => {
    if (N <= 1) return 0;
    const poolDifficulty = Math.log(N) / Math.log(66);
    return 25 + 25 * Math.pow(poolDifficulty, 0.85);
  })();

  const totalVerses = Math.max(1, correctBookData._totalVerses);
  const totalChapters = Math.max(1, correctBookData._chapters.length);

  // Wider, heavy-tailed verse curve. The scale grows gently with book length,
  // but is capped so very long books do not become excessively forgiving.
  const verseScale = Math.max(30, Math.min(55, 30 + 0.01 * totalVerses));
  const maxVerseSpan = Math.max(1, totalVerses - 1);
  const verseRaw = 1 / (1 + Math.pow(verseDistance / verseScale, 2));
  const verseRawAtFullSpan = 1 / (1 + Math.pow(maxVerseSpan / verseScale, 2));
  const verseProximity = Math.max(
    0,
    Math.min(1, (verseRaw - verseRawAtFullSpan) / (1 - verseRawAtFullSpan))
  );

  // Single-chapter books have no meaningful chapter-distance signal.
  // Otherwise, chapter proximity is almost linear, with only a slight curve so
  // nearby chapter errors matter a little more than equally sized distant ones.
  let combinedProximity;
  if (totalChapters <= 1) {
    combinedProximity = verseProximity;
  } else {
    const maxChapterSpan = totalChapters - 1;
    const chapterFraction = Math.max(0, Math.min(1, chapterDistance / maxChapterSpan));
    const chapterProximity = Math.max(0, Math.min(1, 1 - Math.pow(chapterFraction, 0.90)));

    // Fixed weights make the behavior easier to reason about and guarantee a
    // strong same-chapter floor. In whole-Bible mode, even an extremely distant
    // verse inside the correct chapter bottoms out around 85 rather than falling
    // toward the 50-point correct-book floor.
    combinedProximity = 0.30 * verseProximity + 0.70 * chapterProximity;
  }

  const score = correctBookFloor + (nonExactCeiling - correctBookFloor) * combinedProximity;
  return clampScore(score);
}

  const bookLabelY=axisY+29;
  const markerBottom=height-4;
  const minWidth=Math.max(graph2Scroll.clientWidth || 900, 900);

  if (!active.length || !books.length) {
    graph2Layout = null;
    graph2Title.textContent = 'Verse scores';
    graph2.setAttribute('width', minWidth);
    graph2.setAttribute('height', height);
    graph2.setAttribute('viewBox', `0 0 ${minWidth} ${height}`);
    graph2.innerHTML = `<rect x="0" y="0" width="${minWidth}" height="${height}" fill="#fff"/>`;
    return;
  }

  graph2Title.textContent = `Verse scores — ${books.map(book => book.book).join(' · ')}`;
  const pxPerVerse = versePixelsPerVerseWindow(books);
  const bookGap = 18;
  let cursorX = marginL;
  const segments = books.map(book => {
    const startX = cursorX;
    const endX = startX + book._totalVerses * pxPerVerse;
    cursorX = endX + bookGap;
    return { book, startX, endX };
  });
  const width=Math.max(minWidth, cursorX - bookGap + marginR);
  graph2Layout = { segments, pxPerVerse, marginL, marginR, bookGap, width };
  graph2.setAttribute('width',width); graph2.setAttribute('height',height); graph2.setAttribute('viewBox',`0 0 ${width} ${height}`);
  const y = score => marginT + plotH - (score/100)*plotH;
  let s=`<rect x="0" y="0" width="${width}" height="${height}" fill="#fff"/>`;
  for(let score=0;score<=100;score+=10){const yy=y(score);s+=`<line x1="${marginL}" x2="${width-marginR}" y1="${yy}" y2="${yy}" stroke="${score%20===0?'#dfe4ec':'#eef1f5'}"/><text x="${marginL-8}" y="${yy+4}" text-anchor="end" font-size="8" fill="#657084">${score}</text>`;}
  s+=`<line x1="${marginL}" x2="${marginL}" y1="${marginT}" y2="${axisY}" stroke="#596273"/><line x1="${marginL}" x2="${width-marginR}" y1="${axisY}" y2="${axisY}" stroke="#596273"/>`;
  s+=`<text x="13" y="${marginT+plotH/2}" font-size="9" fill="#4f596b" transform="rotate(-90 13 ${marginT+plotH/2})" text-anchor="middle">Score</text>`;

  for (let bi=0; bi<segments.length; bi++) {
    const seg = segments[bi];
    const book = seg.book;
    const xForOrd = ord => seg.startX + (ord-0.5)*pxPerVerse;
    const points=[];

    if (bi > 0) {
      const dividerX = seg.startX - bookGap/2;
      s += `<line x1="${dividerX}" x2="${dividerX}" y1="${marginT}" y2="${height-2}" stroke="#aeb7c5" stroke-width="1.2"/>`;
    }

    for(const ch of book._chapters){
      const centerOrd=(ch.startOrdinal+ch.endOrdinal)/2;
      const cx=xForOrd(centerOrd);
      s+=`<text x="${cx}" y="${chapterLabelY}" text-anchor="middle" font-size="7.5" fill="#556173">${ch.chapter}</text>`;
      if(ch.chapter>1){const sx=xForOrd(ch.startOrdinal)-pxPerVerse/2;s+=`<line x1="${sx}" x2="${sx}" y1="${marginT}" y2="${axisY+5}" stroke="#e0e4eb"/>`;}
      for(let v=1;v<=ch.verses;v++){
        const ord=ch.startOrdinal+v-1;
        const score=calculateScoreTotal(correct,{book:book.book,chapter:ch.chapter,verse:v},active);
        points.push([xForOrd(ord),y(score),ch.chapter,v,score]);
      }
    }

    const bookCenter = (seg.startX + seg.endX) / 2;
    s += `<text x="${bookCenter}" y="${bookLabelY}" text-anchor="middle" font-size="8.5" font-weight="700" fill="#2e394b">${esc(book.book)}</text>`;
    s += `<polyline fill="none" stroke="#3375c4" stroke-width="1.25" pointer-events="none" points="${points.map(p=>`${p[0]},${p[1]}`).join(' ')}"/>`;
    for(const p of points){
      s += `<circle class="verse-point" data-book="${esc(book.book)}" data-chapter="${p[2]}" data-verse="${p[3]}" data-score="${p[4]}" cx="${p[0]}" cy="${p[1]}" r="${books.reduce((sum,b)=>sum+b._totalVerses,0)>2500?0.9:1.25}" fill="#3375c4"/>`;
    }
  }

  const correctSeg = segments.find(seg => seg.book.book === correct.book);
  if (correctSeg) {
    const correctBook = correctSeg.book;
    const correctOrd=getBookVerseOrdinal(correctBook,correct.chapter,correct.verse);
    const markerX=correctSeg.startX+(correctOrd-0.5)*pxPerVerse;
    s+=`<line id="marker2" x1="${markerX}" x2="${markerX}" y1="${marginT}" y2="${markerBottom}" stroke="#d62929" stroke-width="2.2" pointer-events="none"/>`;
  }
  graph2.innerHTML=s;
}
function moveTooltip(e){
  const pad=12;
  tooltip.style.left=(e.clientX+pad)+'px';
  tooltip.style.top=(e.clientY+pad)+'px';
}
function hideTooltip(){tooltip.style.display='none';}
function showGraph1Tooltip(e, target){
  if (!target) return;
  const active=activeBooks();
  const [min,max]=chapterScoreRange(target.book,target.ch,active);
  tooltip.style.display='block';
  tooltip.innerHTML=`<b>${esc(target.book.book)} ${target.ch.chapter}</b><br>Min ${formatScore(min)} · Max ${formatScore(max)}`;
  moveTooltip(e);
}
function showGraph2Tooltip(e, ref){
  if (!ref || !activeBooks().length) return;
  const score=calculateScoreTotal(correct,ref,activeBooks());
  tooltip.style.display='block';
  tooltip.innerHTML=`<b>${esc(ref.book)} ${ref.chapter}:${ref.verse}</b><br>Score ${formatScore(score)}`;
  moveTooltip(e);
}

// Hovering directly over a rendered mark shows its data. During a press-drag,
// the nearest chapter/verse is scrubbed continuously and its data follows the pointer.
graph1.addEventListener('pointermove', e => {
  if (drag1) return;
  const el = e.target.closest?.('.range-bar');
  if (!el) { hideTooltip(); return; }
  tooltip.style.display='block';
  tooltip.innerHTML=`<b>${esc(el.dataset.book)} ${el.dataset.chapter}</b><br>Min ${formatScore(+el.dataset.min)} · Max ${formatScore(+el.dataset.max)}`;
  moveTooltip(e);
});
graph1.addEventListener('pointerleave', () => { if(!drag1) hideTooltip(); });
graph2.addEventListener('pointermove', e => {
  if (drag2) return;
  const el = e.target.closest?.('.verse-point');
  if (!el) { hideTooltip(); return; }
  tooltip.style.display='block';
  tooltip.innerHTML=`<b>${esc(el.dataset.book)} ${el.dataset.chapter}:${el.dataset.verse}</b><br>Score ${formatScore(+el.dataset.score)}`;
  moveTooltip(e);
});
graph2.addEventListener('pointerleave', () => { if(!drag2) hideTooltip(); });

graph1.addEventListener('pointerdown', e => {
  if (e.button !== undefined && e.button !== 0) return;
  if (!activeBooks().length) return;
  e.preventDefault();
  drag1=true; drag2=false;
  updateCorrectFromGraph1Pointer(e,true);
});
graph2.addEventListener('pointerdown', e => {
  if (e.button !== undefined && e.button !== 0) return;
  if (!activeBooks().length) return;
  e.preventDefault();
  graph2DragWindow = graph2Books().map(book => book.book);
  drag2=true; drag1=false;
  updateCorrectFromGraph2Pointer(e,true);
});

window.addEventListener('pointermove', e => {
  if (drag1) { e.preventDefault(); updateCorrectFromGraph1Pointer(e,true); }
  else if (drag2) { e.preventDefault(); updateCorrectFromGraph2Pointer(e,true); }
}, {passive:false});
window.addEventListener('pointerup', () => {
  const wasDragging2 = drag2;
  drag1=false; drag2=false;
  if (wasDragging2) {
    graph2DragWindow=null;
    scheduleRender({center2:true});
  }
});
window.addEventListener('pointercancel', () => {
  const wasDragging2 = drag2;
  drag1=false; drag2=false;
  if (wasDragging2) {
    graph2DragWindow=null;
    scheduleRender({center2:true});
  }
});

function updateCorrectFromGraph1Pointer(e,showData=false){
  const chapters=activeChapters(); if(!chapters.length)return;
  maybeAutoScroll(graph1Scroll,e.clientX);
  const rect=graph1.getBoundingClientRect();
  const scaleX=graph1.viewBox.baseVal.width/rect.width;
  const svgX=(e.clientX-rect.left)*scaleX;
  const marginL=43,slot=G1_SLOT;
  let idx=Math.round((svgX-marginL-slot/2)/slot);
  idx=Math.max(0,Math.min(chapters.length-1,idx));
  const target=chapters[idx];
  const changed=target.book.book!==correct.book || target.ch.chapter!==correct.chapter;
  if(changed){
    correct.book=target.book.book;
    correct.chapter=target.ch.chapter;
    correct.verse=Math.min(correct.verse,target.ch.verses);
    scheduleRender({center2:true});
  }
  if(showData) showGraph1Tooltip(e,target);
}
function updateCorrectFromGraph2Pointer(e,showData=false){
  if(!activeBooks().length || !graph2Layout || !graph2Layout.segments.length)return;
  maybeAutoScroll(graph2Scroll,e.clientX);
  const rect=graph2.getBoundingClientRect();
  const scaleX=graph2.viewBox.baseVal.width/rect.width;
  const svgX=(e.clientX-rect.left)*scaleX;
  const { segments, pxPerVerse } = graph2Layout;

  let bestSeg = segments[0];
  let bestDistance = Infinity;
  for (const seg of segments) {
    const clampedX = Math.max(seg.startX, Math.min(seg.endX, svgX));
    const distance = Math.abs(svgX - clampedX);
    if (distance < bestDistance) { bestDistance = distance; bestSeg = seg; }
  }

  let ordinal=Math.round((svgX-bestSeg.startX)/pxPerVerse + 0.5);
  ordinal=Math.max(1,Math.min(bestSeg.book._totalVerses,ordinal));
  const ref=ordinalToReference(bestSeg.book,ordinal);
  const changed=ref.book!==correct.book || ref.chapter!==correct.chapter || ref.verse!==correct.verse;
  if(changed){
    correct=ref;
    scheduleRender({center1:false, center2:false});
  }
  if(showData) showGraph2Tooltip(e,ref);
}
function maybeAutoScroll(container,clientX){
  const r=container.getBoundingClientRect(); const edge=40; const amount=24;
  if(clientX<r.left+edge)container.scrollLeft-=amount;
  else if(clientX>r.right-edge)container.scrollLeft+=amount;
}

function ensureFirstMarkerVisible(center=false){
  const chapters=activeChapters();
  const idx=chapters.findIndex(x=>x.book.book===correct.book&&x.ch.chapter===correct.chapter);
  if(idx<0)return;
  const x=43+idx*G1_SLOT+G1_SLOT/2;
  scrollXIntoView(graph1Scroll,x,center);
}
function ensureSecondMarkerVisible(center=false){
  if(!activeBooks().length || !graph2Layout)return;
  const seg=graph2Layout.segments.find(item=>item.book.book===correct.book);
  if(!seg)return;
  const ord=getBookVerseOrdinal(seg.book,correct.chapter,correct.verse);
  const x=seg.startX+(ord-0.5)*graph2Layout.pxPerVerse;
  scrollXIntoView(graph2Scroll,x,center);
}
function scrollXIntoView(container,x,center){
  const left=container.scrollLeft,right=left+container.clientWidth;
  if(center){container.scrollLeft=Math.max(0,x-container.clientWidth/2);return;}
  if(x<left+40)container.scrollLeft=Math.max(0,x-40);
  else if(x>right-40)container.scrollLeft=x-container.clientWidth+40;
}

function renderChecklist(){
  const host=document.getElementById('bookChecklist');
  host.innerHTML='';
  host.appendChild(makeTestamentGroup('Old Testament',OLD_TESTAMENT,'otParent'));
  host.appendChild(makeTestamentGroup('New Testament',NEW_TESTAMENT,'ntParent'));
  updateParentStates();
}
function makeTestamentGroup(title,names,parentId){
  const wrap=document.createElement('div');wrap.className='testament';
  const parentLabel=document.createElement('label');parentLabel.className='parent-check';
  const parent=document.createElement('input');parent.type='checkbox';parent.id=parentId;parent.dataset.group=title;
  parentLabel.append(parent,document.createTextNode(title));wrap.appendChild(parentLabel);
  parent.addEventListener('change',()=>{
    for(const name of names){if(parent.checked)selected.add(name);else selected.delete(name);}
    normalizeCorrectAfterSelection();syncChildCheckboxes();updateParentStates();hideTooltip();scheduleRender({center1:true,center2:true});
  });
  for(const name of names){
    const label=document.createElement('label');label.className='book-check';
    const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.dataset.book=name;
    cb.addEventListener('change',()=>{
      if(cb.checked)selected.add(name);else selected.delete(name);
      normalizeCorrectAfterSelection();updateParentStates();hideTooltip();scheduleRender({center1:true,center2:true});
    });
    label.append(cb,document.createTextNode(name));wrap.appendChild(label);
  }
  return wrap;
}
function syncChildCheckboxes(){document.querySelectorAll('input[data-book]').forEach(cb=>cb.checked=selected.has(cb.dataset.book));}
function updateParentStates(){
  for(const [id,names] of [['otParent',OLD_TESTAMENT],['ntParent',NEW_TESTAMENT]]){
    const el=document.getElementById(id); if(!el)continue;
    const count=names.filter(n=>selected.has(n)).length; el.checked=count===names.length; el.indeterminate=count>0&&count<names.length;
  }
}
function normalizeCorrectAfterSelection(){
  const active=activeBooks();
  if(!active.length)return;
  if(selected.has(correct.book))return;
  const oldIdx=canonicalIndex.get(correct.book)??0;
  let best=active[0]; let bestDist=Infinity;
  for(const b of active){const d=Math.abs((canonicalIndex.get(b.book)??0)-oldIdx);if(d<bestDist){best=b;bestDist=d;}}
  correct.book=best.book;
  correct.chapter=Math.min(correct.chapter,best._chapters.length);
  correct.verse=Math.min(correct.verse,getChapterMeta(best,correct.chapter).verses);
}

function renderAll(){
  const active=activeBooks();
  answerBox.value=active.length ? `${correct.book} ${correct.chapter}:${correct.verse}` : '';
  poolText.textContent=`${active.length} book${active.length===1?'':'s'} selected`;
  drawerCount.textContent=active.length;
  renderGraph1(); renderGraph2(); updateParentStates();
  if(!active.length){graph1Scroll.scrollLeft=0;graph2Scroll.scrollLeft=0;graph2Layout=null;return;}
  if(lastRenderBook!==correct.book){
    lastRenderBook=correct.book;
    if(!drag2) ensureSecondMarkerVisible(true);
  }
}

window.addEventListener('resize',()=>scheduleRender());
renderChecklist();
renderAll();
ensureFirstMarkerVisible(true);
ensureSecondMarkerVisible(true);
</script>
</body>
